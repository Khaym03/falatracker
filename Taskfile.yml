version: '3'

vars:
  BIN: bin/falatracker{{exeExt}}
  VERSION:
    sh: git describe --tags --always --dirty 2>nul || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>nul || echo "unknown"
  DATE:
    sh: git show -s --format=%cI HEAD 2>nul || echo "unknown"
  GIT_MSI_VERSION:
    sh: powershell -NoProfile -Command "$t = git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>$null; if ($LASTEXITCODE -eq 0 -and $t) { ($t.Trim() -replace '^v','') } else { '0.1.0' }"
  MSI_VERSION: '{{.MSI_VERSION | default .GIT_MSI_VERSION}}'
  ARCH: '{{.ARCH | default "x64"}}'
  BUILD_DIR: build
  MSI_PATH: '{{.BUILD_DIR}}/falatracker-{{.MSI_VERSION}}-{{.ARCH}}.msi'

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: "Build the binary into bin/ with automatic version, commit and date injection"
    cmds:
      - >
        go build -ldflags="
        -X github.com/Khaym03/falatracker/internal/version.Version={{.VERSION}}
        -X github.com/Khaym03/falatracker/internal/version.Commit={{.COMMIT}}
        -X github.com/Khaym03/falatracker/internal/version.Date={{.DATE}}"
        -o {{.BIN}} .

  run:
    desc: Run in development (text logs). Extra flags after --, e.g. task run -- --headless
    cmds:
      - go run . {{.CLI_ARGS}}

  run:prod:
    desc: Run in production (JSON logs, headless)
    cmds:
      - go run . --env production --headless {{.CLI_ARGS}}

  convert:
    desc: Convert downloaded reports without the browser, e.g. task convert -- --products oc-1-products-details.xlsx --distribution oc-1-distributions-details.xlsx
    cmds:
      - go run . convert {{.CLI_ARGS}}

  version:
    desc: Build and print build information
    deps: [build]
    cmds:
      - '{{.BIN}} version'

  test:
    desc: Run all tests (browser tests need Chrome/Chromium)
    cmds:
      - go test ./...

  test:short:
    desc: Run tests without the browser integration tests
    cmds:
      - go test -short ./...

  test:race:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  cover:
    desc: Run tests and open the coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  lint:
    desc: Check formatting and run go vet
    cmds:
      - cmd: test -z "$(gofmt -l .)" || (gofmt -l . && echo "run 'task fmt'" && exit 1)
      - go vet ./...

  fmt:
    desc: Format the code
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  check:
    desc: Run lint and race tests (before committing)
    cmds:
      - task: lint
      - task: test:race

  shutdown:
    desc: Ask a running instance to shut down
    cmds:
      - curl -X POST http://localhost:2027/shutdown

  tools:install:
    desc: Install required Go packaging tools (go-winres)
    cmds:
      - go install github.com/tc-hib/go-winres@latest

  msi:
    desc: Build binary with Windows metadata and package the WiX v5 MSI
    cmds:
      - go vet ./...
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-msi.ps1 -Version "{{.MSI_VERSION}}" -Arch "{{.ARCH}}"

  msi:sign:
    desc: Build and Authenticode-sign both the binary and MSI (requires CERT_THUMBPRINT)
    preconditions:
      - sh: 'powershell -NoProfile -Command "if ([string]::IsNullOrWhiteSpace(''{{.CERT_THUMBPRINT}}'')) { exit 1 }"'
        msg: "Set CERT_THUMBPRINT (e.g. task msi:sign CERT_THUMBPRINT=YOUR_SHA1)"
    cmds:
      - go vet ./...
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-msi.ps1 -Version "{{.MSI_VERSION}}" -Arch "{{.ARCH}}" -SignCertThumbprint "{{.CERT_THUMBPRINT}}"

  release:tag:
    desc: Create an annotated Git tag vX.Y.Z to trigger the release workflow
    preconditions:
      - sh: 'powershell -NoProfile -Command "if (''{{.TAG}}'' -notmatch ''^v\d+\.\d+\.\d+$'') { exit 1 }"'
        msg: "Provide TAG in vX.Y.Z format (e.g. task release:tag TAG=v0.7.0)"
    cmds:
      - git tag -a "{{.TAG}}" -m "Release {{.TAG}}"
      - powershell -NoProfile -Command "Write-Host 'Tag {{.TAG}} created. Run: git push origin {{.TAG}}' -ForegroundColor Green"

  install:silent:
    desc: Silently install the built MSI (run from an elevated Administrator shell)
    cmds:
      - msiexec /i "{{.MSI_PATH}}" /qn /norestart /L*v "{{.BUILD_DIR}}/install.log"

  uninstall:silent:
    desc: Silently uninstall the built MSI (run from an elevated Administrator shell)
    cmds:
      - msiexec /x "{{.MSI_PATH}}" /qn /norestart /L*v "{{.BUILD_DIR}}/uninstall.log"

  clean:
    desc: Remove build output, MSI artifacts, coverage files, and stray .syso files
    cmds:
      - powershell -NoProfile -Command "Remove-Item -Path 'bin','{{.BUILD_DIR}}','coverage.out' -Recurse -Force -ErrorAction SilentlyContinue; Get-ChildItem -Filter '*.syso' -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue"
